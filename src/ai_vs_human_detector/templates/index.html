<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI vs Real Image Detector</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        --primary: #1d2671;
        --secondary: #c33764;
        --accent: #6366f1;
        --success: #10b981;
        --danger: #ef4444;
        --light-bg: #f8fafc;
        --dark-bg: #0f172a;
        --border-color: #e2e8f0;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        animation: fadeIn 0.6s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .container {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 42px 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideUp 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      }

      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .header {
        text-align: center;
        margin-bottom: 36px;
      }

      h1 {
        color: var(--primary);
        margin-bottom: 8px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .header-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: inline-block;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      p.description {
        color: #64748b;
        margin-top: 0;
        margin-bottom: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
      }

      input[type="file"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        cursor: pointer;
      }

      .file-input-label {
        padding: 18px;
        border: 2px dashed var(--accent);
        border-radius: 14px;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.08),
          rgba(195, 55, 100, 0.08)
        );
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 15px;
        color: var(--primary);
        font-weight: 500;
      }

      .file-input-label:hover {
        border-color: var(--secondary);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.15),
          rgba(195, 55, 100, 0.15)
        );
        transform: translateY(-2px);
      }

      .file-input-label.active {
        border-color: var(--success);
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.1),
          rgba(99, 102, 241, 0.1)
        );
      }

      .file-icon {
        font-size: 20px;
      }

      button {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border: none;
        color: #fff;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      button:hover::before {
        left: 100%;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      button:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(195, 55, 100, 0.35);
      }

      button:not(:disabled):active {
        transform: translateY(-1px);
      }

      .preview {
        position: relative;
        display: none;
        animation: fadeIn 0.4s ease-out;
      }

      .preview.show {
        display: block;
      }

      .preview img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 14px;
        margin-top: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
      }

      .result {
        margin-top: 20px;
        padding: 22px;
        border-radius: 14px;
        display: none;
        animation: slideDown 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .result.show {
        display: block;
      }

      @keyframes slideDown {
        from {
          transform: translateY(-10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .result-content {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .result-icon {
        font-size: 40px;
        flex-shrink: 0;
      }

      .result-text {
        flex: 1;
      }

      .result-label {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .result-confidence {
        font-size: 14px;
        opacity: 0.85;
      }

      .result.ai {
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.1),
          rgba(99, 102, 241, 0.1)
        );
        border: 1px solid rgba(168, 85, 247, 0.3);
        color: #7c3aed;
      }

      .result.real {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.1),
          rgba(34, 197, 94, 0.1)
        );
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #059669;
      }

      .error {
        color: var(--danger);
        margin-top: 14px;
        text-align: center;
        font-size: 14px;
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 8px;
        display: none;
        animation: shake 0.4s ease-in-out;
      }

      .error.show {
        display: block;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 24px;
        }

        h1 {
          font-size: 26px;
        }

        .header-icon {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <main class="card">
        <div class="header">
          <div class="header-icon">🔍</div>
          <h1>AI Detector</h1>
          <p class="description">
            Upload an image to detect whether it's AI-generated or captured in
            the real world
          </p>
        </div>

        <form id="upload-form">
          <div class="file-input-wrapper">
            <input id="file-input" type="file" accept="image/*" required />
            <label for="file-input" class="file-input-label">
              <span class="file-icon">📁</span>
              <span id="file-label-text">Choose an image</span>
            </label>
          </div>
          <button id="submit-btn" type="submit">Analyze Image</button>
        </form>

        <div class="preview" id="preview"></div>
        <div class="result" id="result"></div>
        <div class="error" id="error"></div>
      </main>
    </div>

    <script>
      const form = document.getElementById("upload-form");
      const fileInput = document.getElementById("file-input");
      const submitBtn = document.getElementById("submit-btn");
      const resultBox = document.getElementById("result");
      const errorBox = document.getElementById("error");
      const preview = document.getElementById("preview");
      const fileLabel = document.querySelector(".file-input-label");
      const fileLabelText = document.getElementById("file-label-text");

      fileInput.addEventListener("change", () => {
        errorBox.classList.remove("show");
        errorBox.textContent = "";
        resultBox.classList.remove("show");
        preview.classList.remove("show");
        preview.innerHTML = "";

        const [file] = fileInput.files;
        if (!file) {
          fileLabel.classList.remove("active");
          fileLabelText.textContent = "Choose an image";
          return;
        }

        fileLabel.classList.add("active");
        fileLabelText.textContent = `✅ ${file.name}`;

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement("img");
          img.src = e.target.result;
          preview.appendChild(img);
          preview.classList.add("show");
        };
        reader.readAsDataURL(file);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const [file] = fileInput.files;
        if (!file) {
          errorBox.textContent = "Please choose an image first.";
          errorBox.classList.add("show");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="loading-spinner"></span>Analyzing...';
        errorBox.classList.remove("show");
        errorBox.textContent = "";
        resultBox.classList.remove("show");

        const data = new FormData();
        data.append("file", file);

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            const { error } = await response.json();
            throw new Error(error || "Unexpected server error.");
          }

          const payload = await response.json();
          const confidence = (payload.probability * 100).toFixed(2);
          const label = payload.label.trim().toLowerCase();
          const isAI = label === "ai" || label === "ai-generated";

          resultBox.classList.remove("ai", "real");
          resultBox.classList.add(isAI ? "ai" : "real", "show");

          const icon = isAI ? "🤖" : "📸";
          const resultLabel = isAI ? "AI-Generated" : "Real Image";

          resultBox.innerHTML = `
            <div class="result-content">
              <div class="result-icon">${icon}</div>
              <div class="result-text">
                <div class="result-label">${resultLabel}</div>
                <div class="result-confidence">Confidence: ${confidence}%</div>
              </div>
            </div>
          `;
        } catch (err) {
          errorBox.textContent = "❌ " + err.message;
          errorBox.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Analyze Image";
        }
      });
    </script>
  </body>
</html>
