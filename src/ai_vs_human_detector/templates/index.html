<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI vs Real Image Detector</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1d2671, #c33764);
      }

      .card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 18px;
        padding: 28px 34px;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
      }

      h1 {
        color: #1d2671;
        margin-bottom: 12px;
        font-size: 24px;
        text-align: center;
      }

      p.description {
        color: #40356f;
        margin-top: 0;
        margin-bottom: 22px;
        text-align: center;
        font-size: 15px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      input[type="file"] {
        padding: 10px;
        border: 2px dashed #1d2671;
        border-radius: 12px;
        background: rgba(29, 38, 113, 0.05);
        cursor: pointer;
      }

      button {
        background: linear-gradient(135deg, #1d2671, #c33764);
        border: none;
        color: #fff;
        padding: 12px;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(195, 55, 100, 0.4);
      }

      .result {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(29, 38, 113, 0.08);
        color: #1d2671;
        display: none;
      }

      .error {
        color: #b32424;
        margin-top: 12px;
        text-align: center;
      }

      .preview img {
        width: 100%;
        max-height: 260px;
        object-fit: contain;
        border-radius: 12px;
        margin-top: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>AI vs Real Detector</h1>
      <p class="description">
        Upload an image to check whether the model thinks it was generated by AI
        or captured in the real world.
      </p>

      <form id="upload-form">
        <input id="file-input" type="file" accept="image/*" required />
        <button id="submit-btn" type="submit">Analyze Image</button>
      </form>

      <div class="preview" id="preview"></div>
      <div class="result" id="result"></div>
      <div class="error" id="error"></div>
    </main>

    <script>
      const form = document.getElementById("upload-form");
      const fileInput = document.getElementById("file-input");
      const submitBtn = document.getElementById("submit-btn");
      const resultBox = document.getElementById("result");
      const errorBox = document.getElementById("error");
      const preview = document.getElementById("preview");

      fileInput.addEventListener("change", () => {
        errorBox.textContent = "";
        resultBox.style.display = "none";
        preview.innerHTML = "";

        const [file] = fileInput.files;
        if (!file) {
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement("img");
          img.src = e.target.result;
          preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const [file] = fileInput.files;
        if (!file) {
          errorBox.textContent = "Please choose an image first.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Analyzing...";
        errorBox.textContent = "";
        resultBox.style.display = "none";

        const data = new FormData();
        data.append("file", file);

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            const { error } = await response.json();
            throw new Error(error || "Unexpected server error.");
          }

          const payload = await response.json();
          const confidence = (payload.probability * 100).toFixed(2);
          resultBox.style.display = "block";
          resultBox.textContent = `${payload.label} (confidence: ${confidence}%)`;
        } catch (err) {
          errorBox.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Analyze Image";
        }
      });
    </script>
  </body>
</html>
